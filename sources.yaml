  # ── Known-broken sources (kept here as docs; do not re-enable as-is) ───
  # PubMed RSS (pubmed.ncbi.nlm.nih.gov/rss/search/…) now serves a reCAPTCHA
  # challenge to non-browser clients — would need an E-utilities/EuropePMC
  # JSON adapter (new code path; out of scope for this fix).
  # JADA  https://jada.ada.org/action/showFeed?…       → HTTP 404
  # EFP   https://www.efp.org/news-events/news/feed/   → HTTP 404
  # CSK   https://www.dent.cz/rss/aktuality.xml        → HTML (silently fakes 200)
  # LKS   https://www.dent.cz/lks/rss                  → HTML (silently fakes 200)
