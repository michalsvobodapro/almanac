# Almanac — source feeds. Single source of truth. Pipeline reads this; /sources
# page reads data/source-status.json (which the pipeline writes after each run).
#
# Required per source: id, name, url, language, type
# Optional:           trust (1-5), tags, fetchEvery (hours), maxItems,
#                     primaryCategory (one of: conservative, endodontics,
#                     periodontology, implantology, orthodontics, other)
#
# `primaryCategory` is just a hint for the /sources page UI. Claude classifies
# each *item* into a category at digest time, not by source-level mapping.

defaults:
  fetchEvery: 24
  userAgent: "Mozilla/5.0 (compatible; almanac-bot/1.0; +https://github.com/michalsvobodapro/almanac)"
  timeoutMs: 15000
  maxItems: 30

sources:
  # ── Peer-reviewed journals (Nature / Springer) ─────────────────────────
  - id: bdj
    name: "British Dental Journal"
    url: "https://www.nature.com/bdj.rss"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  - id: bdj-open
    name: "BDJ Open"
    url: "https://www.nature.com/bdjopen.rss"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed, open-access]

  - id: ebd
    name: "Evidence-Based Dentistry"
    url: "https://www.nature.com/ebd.rss"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed, evidence]

  - id: ijos
    name: "International Journal of Oral Science"
    url: "https://www.nature.com/ijos.rss"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  # ── Peer-reviewed journals (Wiley) ─────────────────────────────────────
  - id: jcpe
    name: "Journal of Clinical Periodontology"
    url: "https://onlinelibrary.wiley.com/feed/16000625/most-recent"
    language: en
    type: rss
    trust: 5
    primaryCategory: periodontology
    tags: [journal, peer-reviewed]

  - id: jpr
    name: "Journal of Periodontal Research"
    url: "https://onlinelibrary.wiley.com/feed/1600051x/most-recent"
    language: en
    type: rss
    trust: 5
    primaryCategory: periodontology
    tags: [journal, peer-reviewed]

  - id: iej
    name: "International Endodontic Journal"
    url: "https://onlinelibrary.wiley.com/feed/16000757/most-recent"
    language: en
    type: rss
    trust: 5
    primaryCategory: endodontics
    tags: [journal, peer-reviewed]

  - id: cdoe
    name: "Community Dentistry and Oral Epidemiology"
    url: "https://onlinelibrary.wiley.com/feed/16000528/most-recent"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed, epidemiology]

  - id: jopm
    name: "Journal of Oral Pathology & Medicine"
    url: "https://onlinelibrary.wiley.com/feed/16000714/most-recent"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  - id: ejos
    name: "European Journal of Oral Sciences"
    url: "https://onlinelibrary.wiley.com/feed/16000722/most-recent"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  # ── Specialty associations ─────────────────────────────────────────────
  - id: aae
    name: "American Association of Endodontists"
    url: "https://www.aae.org/specialty/feed/"
    language: en
    type: rss
    trust: 4
    primaryCategory: endodontics
    tags: [association]

  # ── Trade press / news ─────────────────────────────────────────────────
  - id: dentistry-uk
    name: "Dentistry (UK)"
    url: "https://www.dentistry.co.uk/feed/"
    language: en
    type: rss
    trust: 3
    tags: [news, trade]

  - id: dental-products-report
    name: "Dental Products Report"
    url: "https://www.dentalproductsreport.com/rss/"
    language: en
    type: rss
    trust: 3
    tags: [news, products]

  - id: dental-news
    name: "Dental News"
    url: "https://www.dentalnews.com/feed/"
    language: en
    type: rss
    trust: 3
    tags: [news, trade]

  - id: dental-tribune
    name: "Dental Tribune"
    url: "https://www.dental-tribune.com/feed/"
    language: en
    type: rss
    trust: 3
    tags: [news, trade]

  # ── Known-broken sources (kept here as docs; do not re-enable as-is) ───
  # PubMed RSS (pubmed.ncbi.nlm.nih.gov/rss/search/…) now serves a reCAPTCHA
  # challenge to non-browser clients — would need an E-utilities/EuropePMC
  # JSON adapter (new code path; out of scope for this fix).
  # JADA  https://jada.ada.org/action/showFeed?…       → HTTP 404
  # EFP   https://www.efp.org/news-events/news/feed/   → HTTP 404
  # CSK   https://www.dent.cz/rss/aktuality.xml        → HTML (silently fakes 200)
  # LKS   https://www.dent.cz/lks/rss                  → HTML (silently fakes 200)
