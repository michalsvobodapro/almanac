# Almanac — source feeds. Single source of truth. Pipeline reads this; /sources
# page reads data/source-status.json (which the pipeline writes after each run).
#
# Required per source: id, name, url, language, type
# Optional:           trust (1-5), tags, fetchEvery (hours), maxItems,
#                     primaryCategory (one of: conservative, endodontics,
#                     periodontology, implantology, orthodontics, other)
#
# `primaryCategory` is just a hint for the /sources page UI. Claude classifies
# each *item* into a category at digest time, not by source-level mapping.
#
# NOTE (v1.1 work): several feed URLs below are best-guesses from the relevant
# publishers' homepages. Verify each one returns valid RSS before relying on it.

defaults:
  fetchEvery: 24
  userAgent: "almanac-bot/1.0 (+https://github.com/michalsvobodapro/almanac)"
  timeoutMs: 15000
  maxItems: 30

sources:
  # ── Czech ──────────────────────────────────────────────────────────────
  - id: csk-news
    name: "Česká stomatologická komora"
    url: "https://www.dent.cz/rss/aktuality.xml"
    language: cs
    type: rss
    trust: 5
    primaryCategory: other
    tags: [czech, regulatory]

  - id: lks
    name: "LKS — časopis ČSK"
    url: "https://www.dent.cz/lks/rss"
    language: cs
    type: rss
    trust: 4
    primaryCategory: other
    tags: [czech, journal]

  # ── PubMed (per-specialty saved searches) ──────────────────────────────
  # Replace IDs in URL once real saved-search RSS feeds are created on PubMed.
  - id: pubmed-conservative
    name: "PubMed — Conservative dentistry"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/conservative+dentistry/?limit=20"
    language: en
    type: rss
    trust: 4
    primaryCategory: conservative
    tags: [research, pubmed]

  - id: pubmed-endodontics
    name: "PubMed — Endodontics"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/endodontics/?limit=20"
    language: en
    type: rss
    trust: 4
    primaryCategory: endodontics
    tags: [research, pubmed]

  - id: pubmed-periodontology
    name: "PubMed — Periodontology"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/periodontitis+OR+periodontology/?limit=20"
    language: en
    type: rss
    trust: 4
    primaryCategory: periodontology
    tags: [research, pubmed]

  - id: pubmed-implantology
    name: "PubMed — Implantology"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/dental+implant/?limit=20"
    language: en
    type: rss
    trust: 4
    primaryCategory: implantology
    tags: [research, pubmed]

  - id: pubmed-orthodontics
    name: "PubMed — Orthodontics"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/orthodontics/?limit=20"
    language: en
    type: rss
    trust: 4
    primaryCategory: orthodontics
    tags: [research, pubmed]

  # ── Specialty journals & associations ──────────────────────────────────
  - id: jada
    name: "JADA — Journal of the American Dental Association"
    url: "https://jada.ada.org/action/showFeed?type=etoc&feed=rss&jc=tjada"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  - id: bdj
    name: "British Dental Journal"
    url: "https://www.nature.com/bdj.rss"
    language: en
    type: rss
    trust: 5
    tags: [journal, peer-reviewed]

  - id: efp
    name: "EFP — European Federation of Periodontology"
    url: "https://www.efp.org/news-events/news/feed/"
    language: en
    type: rss
    trust: 5
    primaryCategory: periodontology
    tags: [association, guidelines]

  - id: dental-tribune
    name: "Dental Tribune"
    url: "https://www.dental-tribune.com/feed/"
    language: en
    type: rss
    trust: 3
    tags: [news, trade]
