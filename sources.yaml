# Almanac — source feeds. Single source of truth. Pipeline reads this; /sources
# page reads data/source-status.json (which the pipeline writes after each run).
#
# Required per source: id, name, url, language, type
# Optional:           trust (1-5), tags, fetchEvery (hours), maxItems,
#                     primaryCategory (one of: conservative, endodontics,
#                     periodontology, implantology, orthodontics, other)
#
# `primaryCategory` is just a hint for the /sources page UI. Claude classifies
# each *item* into a category at digest time, not by source-level mapping.

defaults:
  fetchEvery: 24
  userAgent: "Mozilla/5.0 (compatible; almanac-bot/1.0; +https://github.com/michalsvobodapro/almanac)"
  # CrossRef "polite pool" contact — sent as mailto on api.crossref.org queries.
  mailto: "michalsvoboda.pro@gmail.com"
  timeoutMs: 15000
  maxItems: 30

sources:
  # ── Peer-reviewed journals (via CrossRef API, by eISSN) ────────────────
  # Publisher RSS (Nature, Wiley) sits behind Cloudflare and 403s GitHub
  # Actions' datacenter IPs, so journals are pulled from the open CrossRef
  # REST API instead. `issn` is the eISSN; `url` is the CrossRef works
  # endpoint (shown on /sources, not the fetch driver — `issn` is).
  - id: bdj
    name: "British Dental Journal"
    issn: "1476-5373"
    url: "https://api.crossref.org/journals/1476-5373/works"
    language: en
    type: crossref
    trust: 5
    tags: [journal, peer-reviewed]

  - id: bdj-open
    name: "BDJ Open"
    issn: "2056-807X"
    url: "https://api.crossref.org/journals/2056-807X/works"
    language: en
    type: crossref
    trust: 5
    tags: [journal, peer-reviewed, open-access]

  - id: ebd
