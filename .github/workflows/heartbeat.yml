name: Heartbeat

# GitHub disables scheduled workflows after 60 days of zero repo activity.
# This keeps the daily digest cron alive even if nobody pushes commits manually.
on:
  schedule:
    - cron: "30 12 * * 1"  # Mondays 12:30 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heartbeat — keeping scheduled workflows active. $(date -u)"
